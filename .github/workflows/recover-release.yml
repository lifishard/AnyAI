name: Recover Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 已成功生成三平台安装包的 Release 运行编号
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: recover-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 验证产物运行对应原始版本标签
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: node scripts/verify-release-source.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 规范文件名、验证并发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
        run: env GITHUB_SHA="$SOURCE_SHA" GITHUB_REF="refs/tags/$SOURCE_TAG" node scripts/publish-release.mjs release-assets
