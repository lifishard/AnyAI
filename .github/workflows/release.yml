name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只构建不发布（发布时请选择版本标签）
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            args: --win
          - os: macos-latest
            name: macOS
            args: --mac
          - os: ubuntu-latest
            name: Linux
            args: --linux
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 类型检查和测试
        run: |
          npm run typecheck
          npm test
      - name: 构建前端
        run: npm run build:fast
      - name: 打包
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 保存平台产物
        uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 验证并发布三平台安装包
    needs: build
    # A manual run is a build check only. Publication must come from the
    # version tag pushed by the release BAT, so it cannot publish stale branch
    # sources or a source tree that was never tagged.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets
      - name: 核对八个安装包、生成校验文件并公开 Release
        run: node scripts/publish-release.mjs release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
