name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只构建不发布
        type: boolean
        default: false

permissions:
  contents: write   # 建 Release 和传附件要这个

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # 一个平台挂了，别把另外两个也取消掉
      matrix:
        include:
          - os: windows-latest
            name: Windows
            args: --win
          - os: macos-latest
            name: macOS
            args: --mac
          - os: ubuntu-latest
            name: Linux
            args: --linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci 的契约是「lock 跟 package.json 必须完全一致」，对不上就直接失败。
      # 加依赖或改了包名之后忘了提交新的 lock，CI 就会在这里挂掉，而且报错
      # 看起来像是构建失败 —— 所以这里退一步用 npm install，并把情况打出来。
      # 正确做法仍然是本地 npm install 之后把 package-lock.json 一起提交。
      - name: 安装依赖
        run: |
          npm ci || {
            echo "::warning::package-lock.json 与 package.json 不同步，已退回 npm install。请在本地跑一次 npm install 并提交新的 lock。"
            npm install --no-audit --no-fund
          }

      # 故意不阻断：类型错不影响产物能不能跑，
      # 打了 tag 说明是要发版，不该卡在这里。CI 工作流会把关。
      - name: 类型检查（仅提示）
        run: npm run typecheck
        continue-on-error: true

      - name: 构建前端
        run: npm run build:fast

      - name: 打包并发布
        run: npx electron-builder ${{ matrix.args }} --publish ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'never' || 'always' }}
        env:
          # electron-builder 在 CI 里会从 GITHUB_REPOSITORY 认出仓库，
          # 所以 package.json 里的 repository 字段写不写都不影响这里
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 没有 Apple 开发者证书，明确关掉签名与公证，否则 macOS 这条会卡住
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 留一份构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore
          retention-days: 14
