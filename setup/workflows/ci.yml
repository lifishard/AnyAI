name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci 的契约是「lock 跟 package.json 必须完全一致」，对不上就直接失败。
      # 加依赖或改了包名之后忘了提交新的 lock，CI 就会在这里挂掉，而且报错
      # 看起来像是构建失败 —— 所以这里退一步用 npm install，并把情况打出来。
      # 正确做法仍然是本地 npm install 之后把 package-lock.json 一起提交。
      - name: 安装依赖
        run: |
          npm ci || {
            echo "::warning::package-lock.json 与 package.json 不同步，已退回 npm install。请在本地跑一次 npm install 并提交新的 lock。"
            npm install --no-audit --no-fund
          }

      # 先跑不需要依赖的低级错误检查：导入对不对得上、有没有漏声明的变量、
      # Record<联合类型> 的键全不全。它比 tsc 快得多，报错也更直白。
      - name: 低级错误检查
        run: npm run check:lite

      # 这一步是拦截线：类型错在这里挡住，别流到 release 里去。
      # 本地打包脚本对类型错只警告不阻断（vite 用 esbuild 剥类型，
      # 类型错不影响能不能跑），但合进主干之前该修干净。
      - name: 类型检查
        run: npm run typecheck

      - name: 构建前端
        run: npm run build:fast

      # 只打包不出安装器：验证 electron-builder 的配置没写坏，
      # 又不用花几分钟去压安装包。
      - name: 验证打包配置
        run: npx electron-builder --linux --dir
